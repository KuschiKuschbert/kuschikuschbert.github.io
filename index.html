<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuschi's apps</title>
<meta name="description" content="Apps made by Daniel Kuschmierz in Rockhampton, Queensland.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap">
<style>
:root {
  --bg: #F7F5F0;
  --surface: #FFFFFF;
  --line: #DEDAD0;
  --ink: #1A1917;
  --muted: #5E5B54;
  --accent: #B86E00;
  --track: #ECE8DF;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E0E11; --surface: #17171B; --line: #2C2C33; --ink: #F2F0EA; --muted: #A09FA8; --accent: #FFB547; --track: #2A2A31;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E0E11; --surface: #17171B; --line: #2C2C33; --ink: #F2F0EA; --muted: #A09FA8; --accent: #FFB547; --track: #2A2A31;
  color-scheme: dark;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.65 "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: 0 20px;
}
main { max-width: 680px; margin: 0 auto; padding-block: 48px 72px; display: flex; flex-direction: column; gap: 36px; }
header { display: flex; align-items: center; gap: 16px; }
header svg { flex-shrink: 0; }
h1, h2 { font-family: Outfit, "DM Sans", system-ui, sans-serif; font-weight: 600; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(28px, 6vw, 38px); line-height: 1.15; letter-spacing: -0.02em; }
h2 { font-size: 21px; line-height: 1.3; }
.date { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
section { display: flex; flex-direction: column; gap: 10px; }
p, ul { margin: 0; }
ul { padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; }
.summary strong { font-family: Outfit, "DM Sans", sans-serif; font-weight: 600; font-size: 18px; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
.table-wrap { overflow-x: auto; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px 10px 0; border-bottom: 1px solid var(--line); }
th { font-weight: 500; color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; }
td:first-child { white-space: nowrap; font-weight: 500; }
a { color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.contact { font-weight: 500; user-select: all; }
footer { color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); padding-top: 18px; }
</style>
<style>
.app { display: flex; align-items: center; gap: 16px; padding: 18px 20px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; }
.app:hover { border-color: var(--accent); }
.app strong { font-family: Outfit, "DM Sans", sans-serif; font-size: 20px; font-weight: 600; display: block; }
.app span { color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<main>
  <header style="flex-direction: column; align-items: flex-start; gap: 8px;">
    <h1>Kuschi's apps</h1>
    <p class="date">Made by Daniel Kuschmierz in Rockhampton, Queensland</p>
  </header>
  <a class="app" href="rocktally/">
    <svg width="64" height="64" viewBox="0 0 100 100" role="img" aria-label="Rocktally logo">
      <circle cx="50" cy="50" r="28" fill="none" stroke="var(--track)" stroke-width="10"></circle>
      <circle cx="50" cy="50" r="28" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="109 176" transform="rotate(-90 50 50)"></circle>
      <rect x="66" y="23" width="24" height="54" rx="12" fill="var(--bg)"></rect>
      <rect x="70" y="27" width="16" height="46" rx="8" fill="var(--ink)"></rect>
      <path d="M74 38h8M78 34v8M74 62h8" stroke="var(--bg)" stroke-width="2.6" stroke-linecap="round" fill="none"></path>
      <circle cx="30.8" cy="70.4" r="13" fill="var(--bg)"></circle>
      <circle cx="30.8" cy="70.4" r="8.5" fill="var(--ink)"></circle>
    </svg>
    <div><strong>Rocktally</strong><span>Tally counter for Android that counts with your volume keys.</span></div>
  </a>
  <footer>Contact: <span class="contact">rocktallyapp@gmail.com</span></footer>
</main>
</body>
</html>
